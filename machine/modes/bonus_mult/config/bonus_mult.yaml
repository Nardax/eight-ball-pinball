#config_version=6

# Bonus Multiplier Mode
# Star rollover (candy cane) progression:
#   Hit 1 → candy cane level 1 (+score)
#   Hit 2 → candy cane level 2 (+score)
#   Hit 3 → 2X multiplier
#   Hit 4 → 3X multiplier
#   Hit 5 → 5X multiplier
#   Hit 6 → Extra Ball
#   Hit 7+ → 5000 per hit
#
# Lane 2 or 3 (whichever is lit) advances multiplier once all 4 top lanes complete.
# Which lane is lit alternates on any switch hit.

mode:
  start_events: ball_started
  stop_events: ball_ended
  priority: 120
  game_mode: true

variable_player:
  # Increment star hit counter on each star rollover
  s_star_rollover_active:
    star_hits:
      int: 1  # ADD 1 to current star_hits

  # Hit 1 — candy cane level 1 (500 pts)
  s_star_rollover_active{current_player.star_hits==1}:
    score: 500

  # Hit 2 — candy cane level 2 (1000 pts)
  s_star_rollover_active{current_player.star_hits==2}:
    score: 1000

  # Hit 3 — 2X multiplier
  s_star_rollover_active{current_player.star_hits==3}:
    bonus_multiplier:
      int: 2
      action: set  # SET to 2 (not add to existing 1)
    score: 0

  # Hit 4 — 3X multiplier
  s_star_rollover_active{current_player.star_hits==4}:
    bonus_multiplier:
      int: 3
      action: set
    score: 0

  # Hit 5 — 5X multiplier
  s_star_rollover_active{current_player.star_hits==5}:
    bonus_multiplier:
      int: 5
      action: set
    score: 0

  # Hit 7+ — 5000 per hit
  s_star_rollover_active{current_player.star_hits>=7}:
    score: 5000

  # Lane advance: if all 4 top lanes collected, lit lane advances multiplier
  s_lane_2_active{current_player.ball_1_collected and current_player.ball_2_collected and current_player.ball_3_collected and current_player.ball_4_collected and current_player.lit_advance_lane==2}:
    star_hits:
      int: 1

  s_lane_3_active{current_player.ball_1_collected and current_player.ball_2_collected and current_player.ball_3_collected and current_player.ball_4_collected and current_player.lit_advance_lane==3}:
    star_hits:
      int: 1

  # Alternate which lane is lit: ADD (5 - 2*current) to current → result = 5 - current
  # When current=2: ADD 1 → 3; when current=3: ADD -1 → 2
  s_lane_1_active:
    lit_advance_lane:
      int: 5 - 2 * current_player.lit_advance_lane
  s_lane_2_active:
    lit_advance_lane:
      int: 5 - 2 * current_player.lit_advance_lane
  s_lane_3_active:
    lit_advance_lane:
      int: 5 - 2 * current_player.lit_advance_lane
  s_lane_4_active:
    lit_advance_lane:
      int: 5 - 2 * current_player.lit_advance_lane

# Light the multiplier LEDs as they are reached
light_player:
  s_star_rollover_active{current_player.star_hits==1}:
    l_candy_1:
      color: yellow
  s_star_rollover_active{current_player.star_hits==2}:
    l_candy_2:
      color: yellow
  s_star_rollover_active{current_player.star_hits>=3}:
    l_mult_2x:
      color: green
  s_star_rollover_active{current_player.star_hits>=4}:
    l_mult_3x:
      color: green
  s_star_rollover_active{current_player.star_hits>=5}:
    l_mult_5x:
      color: green
  s_star_rollover_active{current_player.star_hits>=6}:
    l_extra_ball:
      color: white

  # Lane-lit indicators — show which of lane 2/3 is lit for multiplier advance.
  # lit_advance_lane always starts at 2 on mode start — set unconditionally
  mode_bonus_mult_started:
    l_lane_2_lit:
      color: white
    l_lane_3_lit:
      color: off
  # Custom events fired from event_player when toggle happens (before variable changes)
  lit_lane_to_2:
    l_lane_2_lit:
      color: white
    l_lane_3_lit:
      color: off
  lit_lane_to_3:
    l_lane_3_lit:
      color: white
    l_lane_2_lit:
      color: off

# Award extra ball at hit 6
event_player:
  s_star_rollover_active{current_player.star_hits==5}:
    - extra_ball_awarded
  # Fire lighting events BEFORE variable changes (snapshot evaluation)
  # Current value == 2 means it WILL toggle to 3
  s_lane_1_active{current_player.lit_advance_lane==2}:
    - lit_lane_to_3
  s_lane_1_active{current_player.lit_advance_lane==3}:
    - lit_lane_to_2
  s_lane_2_active{current_player.lit_advance_lane==2}:
    - lit_lane_to_3
  s_lane_2_active{current_player.lit_advance_lane==3}:
    - lit_lane_to_2
  s_lane_3_active{current_player.lit_advance_lane==2}:
    - lit_lane_to_3
  s_lane_3_active{current_player.lit_advance_lane==3}:
    - lit_lane_to_2
  s_lane_4_active{current_player.lit_advance_lane==2}:
    - lit_lane_to_3
  s_lane_4_active{current_player.lit_advance_lane==3}:
    - lit_lane_to_2
extra_balls:
  extra_ball_bonus_mult:
    award_events: extra_ball_awarded

sound_player:
  extra_ball_awarded:
    sfx_extra_ball:
      action: play
