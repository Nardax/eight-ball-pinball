#config_version=6

# Rack Complete Mode
# Fires when all 8 balls are collected in a rack.
# Locks in 24,000 base bonus, resets ball tracking, increments rack counter.

mode:
  start_events: eight_ball_rack_complete
  stop_events: rack_complete_done
  priority: 300
  game_mode: true

slides:
  rack_complete_slide:
    widgets:
      - type: text
        text: RACK COMPLETE!
        font_size: 36
        y: 60%
      - type: text
        text: +24,000 BONUS LOCKED
        font_size: 24
        y: 40%

slide_player:
  mode_rack_complete_started: rack_complete_slide

variable_player:
  mode_rack_complete_started:
    # Lock in 24,000 base bonus; accumulates per rack
    base_bonus_locked:
      int: player.base_bonus_locked + 24000
    rack_count:
      int: player.rack_count + 1
    # Reset individual ball tracking for next rack
    ball_1_collected: false
    ball_2_collected: false
    ball_3_collected: false
    ball_4_collected: false
    ball_5_collected: false
    ball_6_collected: false
    ball_7_collected: false
    ball_8_collected: false
    balls_collected: 0

show_player:
  mode_rack_complete_started: rack_complete_show

sound_player:
  mode_rack_complete_started:
    sfx_rack_complete:
      action: play

# End mode after show completes (2 seconds)
event_player:
  mode_rack_complete_started:
    - rack_complete_done|2s
