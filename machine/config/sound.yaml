#config_version=6

# Eight Ball Pinball — Sound Configuration
# Virtual: PC speakers / audio output
# Hardware: FAST Audio Interface

sound_system:
  buffer: 512
  frequency: 44100
  channels: 2
  tracks:
    music:
      volume: 0.5
      simultaneous_sounds: 1
    sfx:
      volume: 0.8
      simultaneous_sounds: 8

# Sound pools give variety by randomly selecting from multiple files
# Placeholder filenames — replace with actual audio assets before testing
sound_player:
  # Scored events
  score_1000:
    sfx_chime_high:
      action: play
  score_100:
    sfx_chime_mid:
      action: play
  score_10:
    sfx_chime_low:
      action: play

sounds:
  sfx_spinner:
    file: sfx_spinner.wav
    track: sfx
    volume: 0.7
    max_queue_time: 0s

  sfx_pop_bumper:
    file: sfx_pop_bumper.wav
    track: sfx
    volume: 0.8

  sfx_slingshot:
    file: sfx_slingshot.wav
    track: sfx
    volume: 0.7

  sfx_target_hit:
    file: sfx_target_hit.wav
    track: sfx
    volume: 0.8

  sfx_rollover:
    file: sfx_rollover.wav
    track: sfx
    volume: 0.6

  sfx_drain:
    file: sfx_drain.wav
    track: sfx
    volume: 1.0

  sfx_bonus_count:
    file: sfx_bonus_count.wav
    track: sfx
    volume: 0.8

  sfx_extra_ball:
    file: sfx_extra_ball.wav
    track: sfx
    volume: 1.0

  sfx_rack_complete:
    file: sfx_rack_complete.wav
    track: sfx
    volume: 1.0

  sfx_chime_high:
    file: sfx_chime_high.wav
    track: sfx
    volume: 0.9

  sfx_chime_mid:
    file: sfx_chime_mid.wav
    track: sfx
    volume: 0.9

  sfx_chime_low:
    file: sfx_chime_low.wav
    track: sfx
    volume: 0.9

  music_attract:
    file: music_attract.wav
    track: music
    volume: 0.6
    loops: -1



