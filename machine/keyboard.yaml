#config_version=6

# Eight Ball Pinball — Keyboard Mappings for Virtual Play-Testing
# Simulates every switch via PC keyboard keys

keyboard:
  # --- Flippers ---
  z:
    switch: s_flipper_left
  "/":
    switch: s_flipper_right

  # --- Cabinet ---
  "1":
    switch: s_start_button
    toggle: false
  "5":
    switch: s_coin
    toggle: false

  # --- Plunger (press & hold to set strength, release to launch) ---
  space:
    switch: s_plunger_lane
    toggle: false

  # --- Top lanes (1-4) ---
  q:
    switch: s_lane_1
  w:
    switch: s_lane_2
  e:
    switch: s_lane_3
  r:
    switch: s_lane_4

  # --- Stand-up targets ---
  t:
    switch: s_target_5
  y:
    switch: s_target_6

  # --- Return lane / 8-ball / spinner / star rollover ---
  u:
    switch: s_return_lane_7
  i:
    switch: s_eight_ball_target
  o:
    switch: s_spinner
  p:
    switch: s_star_rollover

  # --- Pop bumpers ---
  a:
    switch: s_pop_bumper_left
  s:
    switch: s_pop_bumper_right
  d:
    switch: s_pop_bumper_top

  # --- Slingshots ---
  f:
    switch: s_slingshot_left
  g:
    switch: s_slingshot_right

  # --- Outlane / kickback ---
  h:
    switch: s_left_outlane
  j:
    switch: s_kickback_lane

  # --- Drain ---
  k:
    switch: s_outhole
    toggle: false

  # --- Tilt ---
  l:
    switch: s_tilt
    toggle: false
